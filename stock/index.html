<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>낚맛 창고 털이 판매 목록</title>
<meta name="description" content="낚맛 창고 털이 라이브 판매 목록. 릴과 로드의 남은 수량과 가격을 확인해 보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="낚맛 창고 털이 판매 목록">
<meta property="og:description" content="릴·로드 남은 수량과 가격을 확인해 보세요">
<meta name="theme-color" content="#08070C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 라이브 판매 목록: 사전예약 페이지와 같은 검정 + 퍼플 + 글라스 디자인. 릴/로드 탭, 검색, 브랜드별 묶음 */
:root{
  --ink:#08070C; --carbon:#14111E; --plum:#2B1460; --violet:#7C3AED; --lavender:#B79CFF;
  --flare:#FC5C2F; --foam:#F5F3FA; --mist:#BDB4D8; --tick:#7D72A8; --muted:#8E85AE; --white:#FFFFFF;
  --field:#0E0C15; --line:#2A2440;
  --glass:rgba(20,17,30,.52); --glass-strong:rgba(18,15,28,.86);
  --glass-edge:rgba(189,180,216,.20); --glass-hi:rgba(245,243,250,.08);
  --glow-violet:rgba(124,58,237,.38); --glow-violet-soft:rgba(124,58,237,.20); --shadow:rgba(0,0,0,.40);
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-heading:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.9,.1,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--font-body);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2{font-family:var(--font-heading);font-weight:400;margin:0}
p{margin:0}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;line-height:1}
.wrap{width:100%;max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(70% 38% at 100% 0%,var(--glow-violet),transparent 70%),
    radial-gradient(60% 40% at 0% 70%,var(--glow-violet-soft),transparent 72%),
    var(--ink)}
.band{position:absolute;left:0;right:0;top:18%;height:52%;background:var(--plum);opacity:.6;clip-path:polygon(0 46%,100% 0,100% 54%,0 100%)}

.top{display:flex;align-items:center;justify-content:space-between;padding-block:20px 0}
.top img{display:block;width:116px;height:auto}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--flare);color:var(--ink);
  font-family:var(--font-display);font-weight:800;font-size:14px;line-height:16px;letter-spacing:.08em;padding:5px 9px 4px;border-radius:2px}
.dot{position:relative;width:8px;height:8px;border-radius:999px;background:var(--ink)}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--ink);animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}

.hero{padding-block:32px 20px;display:grid;gap:10px}
.eyebrow{font-size:15px;line-height:20px;font-weight:600;color:var(--mist)}
.eyebrow b{color:var(--foam);font-weight:700}
.hero h1{font-size:clamp(40px,11.5vw,56px);line-height:1.08;letter-spacing:-.01em}
.hero h1 .x{display:block;color:var(--lavender)}
.lead{font-size:16px;line-height:26px;color:var(--mist)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.stat{display:flex;align-items:baseline;gap:6px;padding:10px 14px;border:1px solid var(--glass-edge);border-radius:8px;background:var(--glass);font-size:14px;font-weight:600;color:var(--mist)}
.stat .num{font-size:24px;font-weight:900;color:var(--foam)}

/* 탭과 검색은 스크롤해도 위에 붙어 있다 */
.bar{position:sticky;top:0;z-index:5;padding-block:12px;background:var(--glass-strong);border-bottom:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.bar .wrap{display:grid;gap:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:8px;background:var(--field);border:1px solid var(--line)}
.tab{appearance:none;border:0;border-radius:6px;background:transparent;color:var(--mist);font:inherit;font-size:16px;font-weight:700;
  min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab small{font-size:13px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--violet);color:var(--white)}
.tab[aria-selected="true"] small{color:var(--foam)}
.tab:focus-visible,.search input:focus-visible,.clear:focus-visible{outline:2px solid var(--lavender);outline-offset:2px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{width:100%;height:48px;padding:0 14px 0 42px;border-radius:8px;border:1px solid var(--tick);background:var(--field);color:var(--foam);font:inherit;font-size:16px}
.search input::placeholder{color:var(--muted)}

.list{padding-block:20px 8px;display:grid;gap:22px}
.brand{display:grid;gap:8px}
.brand h2{display:flex;align-items:baseline;gap:8px;font-size:22px;line-height:30px}
.brand h2 small{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;border:1px solid var(--glass-edge);border-radius:10px;background:var(--glass);overflow:hidden;
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px}
.item+.item{border-top:1px solid var(--line)}
.item .name{min-width:0;display:grid;gap:4px}
.item .name b{font-size:16px;line-height:22px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.qty{font-size:13px;line-height:18px;font-weight:600;color:var(--mist)}
.qty .num{font-size:16px;font-weight:900;color:var(--lavender);margin:0 1px}
.price{flex:none;display:flex;align-items:baseline;gap:2px}
.price .num{font-size:26px;font-weight:900}
.price small{font-size:14px;font-weight:600;color:var(--mist)}
.item.sold{opacity:.45}
.item.sold .price .num{text-decoration:line-through;text-decoration-thickness:2px}
.badge-sold{display:inline-block;justify-self:start;font-size:12px;line-height:16px;font-weight:700;color:var(--ink);background:var(--mist);padding:2px 7px;border-radius:2px}

.empty{padding:32px 16px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--mist)}
.clear{appearance:none;cursor:pointer;height:44px;padding:0 18px;border-radius:4px;border:1px solid var(--tick);background:transparent;color:var(--foam);font:inherit;font-size:14px;font-weight:700}

.foot{padding-block:24px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.note{font-size:13px;line-height:20px;color:var(--mist)}
.foot img{width:96px;height:auto;opacity:.8}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="band"></div></div>

<header class="top wrap">
  <img src="../assets/logo-white.webp" alt="낚맛 낚시의맛" width="232" height="57">
  <span class="live"><i class="dot"></i>LIVE SALE</span>
</header>

<section class="hero wrap" aria-labelledby="title">
  <p class="eyebrow"><b>낚맛</b> 창고 털이 라이브</p>
  <h1 id="title">창고 털이<span class="x">판매 목록</span></h1>
  <p class="lead">남은 수량과 가격을 확인해 보세요.</p>
  <div class="stats" id="stats"></div>
</section>

<div class="bar">
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="품목 종류">
      <button type="button" class="tab" role="tab" id="tab-reel" data-kind="reel" aria-controls="list">릴 <small id="n-reel"></small></button>
      <button type="button" class="tab" role="tab" id="tab-rod" data-kind="rod" aria-controls="list">로드 <small id="n-rod"></small></button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="모델명 검색 (예: 세피아, C3000)" autocomplete="off" aria-label="모델명 검색">
    </label>
  </div>
</div>

<main class="wrap">
  <div class="list" id="list" role="tabpanel" aria-live="polite"></div>
  <div class="empty" id="empty" hidden>
    <p id="emptyText"></p>
    <button type="button" class="clear" id="clear">검색어 지우기</button>
  </div>
</main>

<footer class="foot wrap">
  <p class="note">11월 1일 방송 기준이에요. 방송 중에 팔리면 수량이 바뀔 수 있어요.</p>
  <img src="../assets/logo-white.webp" alt="" width="232" height="57">
</footer>

<script>
(()=>{
  // 판매 목록: [브랜드, 품명, 수량, 가격]. 수량이 0이면 품절로 보인다
  const DATA={
    reel:[
      ['시마노','트윈파워 C2000S (20)',2,400000],
      ['시마노','반포드 C2000S (20)',3,260000],
      ['시마노','반포드 C3000SDH (20)',2,280000],
      ['시마노','세피아 SS C3000SDH (19)',3,240000],
      ['시마노','세피아 SS C3000SDHHG (19)',1,240000],
      ['시마노','세피아 XR C3000SDH (21)',3,330000],
      ['시마노','염월 CT 150PG 우핸들 (19)',1,250000],
      ['시마노','염월 프리미엄 150HG 우핸들 (18)',1,350000],
      ['시마노','오시아 콘퀘스트 200HG 우핸들 (14)',1,480000],
      ['시마노','오시아 콘퀘스트 200PG 우핸들 (15)',1,480000],
      ['시마노','염월 100PG 우핸들 (21)',1,270000],
      ['시마노','염월 101PG 좌핸들 (21)',1,270000],
      ['시마노','환풍 XT 150 우핸들 (20)',1,100000],
      ['시마노','환풍 XT 151 좌핸들 (20)',1,100000],
      ['시마노','소아레 BB C2000SSPG (22)',1,160000],
      ['시마노','비비엑스 HF C3000DXG (22)',2,480000],
      ['시마노','넥서브 C2000S BOX (21)',1,50000],
      ['시마노','스텔라 C3000SDHHG (22)',1,780000],
      ['다이와','20 루비아스 LT 3000C',1,360000],
      ['다이와','20 루비아스 FC LT 2500S',1,350000],
    ],
    rod:[
      ['시마노','세피아 BB S86M-S (22)',2,160000],
      ['시마노','세피아 BB S86M (22)',1,150000],
      ['시마노','세피아 BB 팁 에깅 S66ML-S (18)',1,140000],
      ['시마노','세피아 BB 팁 에깅 S66M-S (18)',1,150000],
      ['시마노','세피아 SS 메탈 슷테 B66M-S (19)',1,250000],
      ['시마노','세피아 SS 팁 에깅 S66ML-S (19)',1,240000],
      ['시마노','세피아 SS 팁 에깅 S66M-S (19)',1,250000],
      ['시마노','세피아 엑스튠 S82ML (20)',1,460000],
      ['시마노','세피아 엑스튠 S86ML (20)',1,460000],
      ['시마노','세피아 엑스튠 S86M (20)',1,470000],
      ['시마노','세피아 XR 팁 에깅 S68ML-S/R (22)',1,340000],
      ['시마노','세피아 BB 팁 에깅 S70M-S (18)',1,150000],
      ['시마노','세피아 XR 메탈 슷테 S70MH-S/R (22)',1,350000],
      ['시마노','세피아 XR 메탈 슷테 B66M-S/F (22)',1,340000],
      ['시마노','세피아 SS 메탈 슷테 S70MH-S/R (22)',1,260000],
      ['시마노','세피아 엑스튠 메탈 슷테 B66ML-S/F (21)',1,470000],
      ['시마노','세피아 BB 메탈 슷테 S66ML-S (18)',1,140000],
      ['시마노','염월 XR FS-B55ML RIGHT (21)',1,350000],
      ['시마노','염월 XR FS-B55ML LEFT (21)',1,350000],
      ['시마노','염월 XR FS-B66ML LEFT (21)',1,350000],
      ['시마노','염월 XR FS-B66ML RIGHT (21)',1,350000],
      ['시마노','염월 XR FS-B66M RIGHT (21)',1,360000],
      ['시마노','염월 XR N-B610ML-S RIGHT (21)',1,330000],
      ['기간이즘','3GO-B C682M',1,120000],
      ['기간이즘','3GO-B C672MH',1,120000],
      ['기간이즘','3GO-B C692H',1,120000],
      ['기간이즘','THC-B S682L',1,210000],
      ['기간이즘','THC-B C682MH',1,210000],
      ['기간이즘','3GO-SR S602UL',1,120000],
      ['기간이즘','3GO-SR S632L',1,120000],
      ['기간이즘','3GO-SR S662L',1,120000],
      ['기간이즘','TH-B C682M',1,190000],
      ['JSCOMPANY','NIXX POP 2 S662ML',1,80000],
      ['JSCOMPANY','NIXX POP 2 BC652MR',1,80000],
      ['JSCOMPANY','BIXOD B1 2021 BC692MH',2,140000],
      ['JSCOMPANY','BIXOD B1 2021 BC712H',1,150000],
      ['블랙홀','다크호스2 배스 S-692M',1,90000],
      ['블랙홀','다크호스2 배스 C-652ML',1,90000],
      ['블랙홀','다크호스2 배스 C-682MH',2,90000],
      ['블랙홀','다크호스2 배스 C-712MH',2,90000],
      ['블랙홀','다크호스2 배스 C-752XH',1,100000],
      ['블랙홀','실크로드2 에디션 S-682ML',1,150000],
      ['블랙홀','실크로드2 에디션 C-702ML',1,150000],
      ['블랙홀','실크로드2 에디션 C-702M',1,160000],
      ['블랙홀','실크로드2 에디션 C-752MH',2,160000],
      ['블랙홀','실크로드2 에디션 C-7112H',1,160000],
      ['블랙홀','실크로드2 에디션 C-722M (ONE & HALF)',1,160000],
      ['블랙홀','실크로드2 에디션 C-732XH (ONE & HALF)',1,170000],
      ['블랙홀','실크로드2 에디션 C-762XXH (ONE & HALF)',1,170000],
      ['블랙홀','실크로드2 에디션 C-762MH (ONE & HALF)',3,160000],
    ]
  };
  const $=s=>document.querySelector(s);
  const won=n=>n.toLocaleString('ko-KR');
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const left=k=>DATA[k].reduce((a,r)=>a+r[2],0);
  const kinds=[['reel','릴'],['rod','로드']];

  kinds.forEach(([k])=>{ $('#n-'+k).textContent=DATA[k].length+'종'; });
  $('#stats').innerHTML=kinds.map(([k,label])=>'<span class="stat">'+label+' <span class="num">'+left(k)+'</span>개 남음</span>').join('');

  let kind=location.hash==='#rod'?'rod':'reel';
  const q=$('#q'), list=$('#list'), empty=$('#empty');
  // 띄어쓰기·대소문자·하이픈을 무시하고 찾는다(예: "c3000" → C3000SDH)
  const norm=s=>s.toLowerCase().replace(/[\s\-()]/g,'');

  function render(){
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.kind===kind)));
    list.setAttribute('aria-labelledby','tab-'+kind);
    const term=norm(q.value);
    const rows=DATA[kind].filter(r=>!term||norm(r[0]+r[1]).includes(term));
    const brands=[...new Set(rows.map(r=>r[0]))];
    list.innerHTML=brands.map(b=>{
      const items=rows.filter(r=>r[0]===b);
      return '<section class="brand"><h2>'+esc(b)+' <small>'+items.length+'종</small></h2><ul class="items">'+
        items.map(([,name,n,price])=>
          '<li class="item'+(n?'':' sold')+'"><div class="name"><b>'+esc(name)+'</b>'+
          (n?'<span class="qty">남은 수량 <span class="num">'+n+'</span>개</span>':'<span class="badge-sold">품절</span>')+
          '</div><div class="price"><span class="num">'+won(price)+'</span><small>원</small></div></li>').join('')+
        '</ul></section>';
    }).join('');
    empty.hidden=rows.length>0;
    if(!rows.length) $('#emptyText').textContent='‘'+q.value.trim()+'’에 맞는 '+(kind==='reel'?'릴이':'로드가')+' 없어요. 다른 탭도 확인해 보세요.';
  }
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    kind=t.dataset.kind; history.replaceState(null,'','#'+kind); render();
  }));
  q.addEventListener('input',render);
  $('#clear').addEventListener('click',()=>{ q.value=''; render(); q.focus(); });
  render();
})();
</script>
</body>
</html>
